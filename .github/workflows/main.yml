name: Page Build

on:
    push:
        branches:
            - main

jobs:
    build:
        permissions:
            id-token: write
            pages: write

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Build
              run: |
                  bun install --frozen-lockfile
                  bun run lint
                  bun run build

            - name: Setup Pages
              uses: actions/upload-pages-artifact@v3
              with:
                  path: 'dist/'

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
